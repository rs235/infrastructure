---
name: AWS - Ansible Check - aws-website

on:
  pull_request:
    paths:
      - "ansible/inventories/home/**"
      - "ansible/playbooks/aws_website.yml"
      - "ansible/roles/**"
      - "ansible/requirements.yml"
      - "ansible/ansible.cfg"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ansible-check-aws-website:
    uses: ./.github/workflows/reusable-ansible-check.yml
    with:
      working-directory: ansible
      concurrency-group: aws-website
      runner: '["self-hosted", "Linux", "X64", "infra", "home"]'
      environment: aws
      ansible-playbook: aws_website
      ansible-inventory-group: project_website

    secrets:
      ansible_ssh_private_key: ${{ secrets.AWS_ANSIBLE_SSH_PRIVATE_KEY }}
      ansible_vault_password: ${{ secrets.AWS_ANSIBLE_VAULT_PASSWORD }}
