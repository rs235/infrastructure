---
name: AWS - Ansible Apply - aws-website

on:
  push:
    branches:
      - main
    paths:
      - "ansible/inventories/home/**"
      - "ansible/playbooks/aws_website.yml"
      - "ansible/roles/**"
      - "ansible/requirements.yml"
      - "ansible/ansible.cfg"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-apply-aws-website:
    uses: ./.github/workflows/reusable-ansible-apply.yml
    with:
      environment: aws
      runner: '["self-hosted", "Linux", "X64", "infra", "home"]'
      concurrency-group: home-ansible-aws-website
      working-directory: ansible
      ansible-playbook: aws_website
      ansible-inventory-group: project_website

    secrets:
      ansible_ssh_private_key: ${{ secrets.AWS_ANSIBLE_SSH_PRIVATE_KEY }}
      ansible_vault_password: ${{ secrets.AWS_ANSIBLE_VAULT_PASSWORD }}
