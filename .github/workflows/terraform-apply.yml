name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-home-sandbox
  cancel-in-progress: false

jobs:
  terraform:
    runs-on:
      - self-hosted
    
    env:
      TF_INPUT: "0"
      TF_LOG: ERROR
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_INSECURE: ${{ secrets.PROXMOX_VE_INSECURE }}

    defaults:
      run:
        working-directory: terraform/environments/home/sandbox

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.0

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  ansible:
    needs: terraform
    runs-on:
      - self-hosted
    
    env:
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_INSECURE: ${{ secrets.PROXMOX_VE_INSECURE }}

    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.6"

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv

      - name: Install Ansible
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Create vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Wait for machines
        run: |
          .venv/bin/ansible all \
            -i inventories/home/inventory.yml \
            --vault-password-file .vault_pass \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=300"

      - name: Ansible Configure
        run: |
          .venv/bin/ansible-playbook \
          -i inventories/home/inventory.yml \
          --vault-password-file .vault_pass \
          playbooks/sandbox.yml

      - name: Remove vault password
        if: always()
        run: rm -f .vault_pass