name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-home-sandbox
  cancel-in-progress: false

jobs:
  terraform:
    runs-on:
      - self-hosted
      - infra
      - home
    
    env:
      TF_INPUT: "0"
      TF_LOG: ERROR
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_INSECURE: ${{ secrets.PROXMOX_VE_INSECURE }}

    defaults:
      run:
        working-directory: terraform/environments/home/sandbox

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          # Pinned exact version to ensure reproducibility. 
          terraform_version: "1.15.0"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  ansible:
    needs:
      - terraform

    runs-on:
      - self-hosted
      - infra
      - home

    env:
      ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # Pinned major and minor version to ensure reproducibility but allow newest patches.
          python-version: "3.13"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_ansible
          chmod 600 ~/.ssh/id_ed25519_ansible

      - name: Create Python virtual environment
        run: |
          python3 -m venv "${{ runner.temp }}/venv"

      - name: Install Ansible and requirements
        run: |
          "${{ runner.temp }}/venv/bin/python" -m pip install --upgrade pip
          "${{ runner.temp }}/venv/bin/python" -m pip install -r requirements.txt

      - name: Create vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "${{ runner.temp }}/vault_pass"
          chmod 600 "${{ runner.temp }}/vault_pass"

      # Changed timeout from 300 to 5 for testing
      - name: Wait for machines
        run: |
          "${{ runner.temp }}/venv/bin/ansible" sandbox \
            -i inventories/home/inventory.yml \
            --vault-password-file "${{ runner.temp }}/vault_pass" \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=5"

      - name: Ansible Configure
        run: |
          "${{ runner.temp }}/venv/bin/ansible-playbook" \
          -i inventories/home/inventory.yml \
          --vault-password-file "${{ runner.temp }}/vault_pass" \
          playbooks/sandbox.yml