---
name: Reusable Ansible Check

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string

      concurrency-group:
        required: true
        type: string

      runner:
        required: true
        type: string

      ansible-playbook:
        required: true
        type: string

      ansible-inventory-group:
        required: true
        type: string

      environment:
        required: true
        type: string

    secrets:
      ansible_ssh_private_key:
        required: true

      ansible_vault_password:
        required: true

concurrency:
  group: ${{ inputs.concurrency-group }}
  cancel-in-progress: false

jobs:
  yamllint:
    name: YAML Linting
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Create Python virtual environment and add it to PATH
        run: |
          python -m venv "${{ runner.temp }}/venv"
          echo "${{ runner.temp }}/venv/bin" >> "$GITHUB_PATH"

      - name: Install pip
        run: python -m pip install pip==26.2.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          clean: true

      - name: Install yamllint
        run: |
          python -m pip install yamllint==1.38.0

      - name: Run yamllint
        run: |
          yamllint --format github .

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          # Temporary, automatically generated GitHub Token for GH API access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  trivy:
    name: Security Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          clean: true

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'

  reusable-ansible-check:
    name: Ansible Check
    needs: [yamllint, gitleaks, trivy]
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    env:
      ANSIBLE_NOCOLOR: "1"

    steps:
      - name: Clean workspace on self hosted runner
        # Override working directory for this step to ensure entire workspace is cleaned.
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf "${GITHUB_WORKSPACE:?}"/*
          rm -rf "${GITHUB_WORKSPACE:?}"/.[!.]*
          rm -rf "${GITHUB_WORKSPACE:?}"/..?*

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Create Python virtual environment and add it to PATH
        run: |
          python -m venv "${{ runner.temp }}/venv"
          echo "${{ runner.temp }}/venv/bin" >> "$GITHUB_PATH"

      - name: Install pip
        run: python -m pip install pip==26.2.1

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH
        run: |
          mkdir -p "${{ runner.temp }}/.ssh"
          chmod 700 "${{ runner.temp }}/.ssh"
          printf '%s' "${{ secrets.ansible_ssh_private_key }}" > "${{ runner.temp }}/.ssh/id_ed25519_ansible"
          chmod 600 "${{ runner.temp }}/.ssh/id_ed25519_ansible"

      - name: Create vault password file
        run: |
          printf '%s' "${{ secrets.ansible_vault_password }}" > "${{ runner.temp }}/vault_pass"
          chmod 600 "${{ runner.temp }}/vault_pass"

      - name: Wait for machines
        run: |
          ansible" ${{ inputs.ansible-inventory-group }} \
            -i "inventories/${{ inputs.environment }}/inventory.yml" \
            --vault-password-file "${{ runner.temp }}/vault_pass" \
            --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=300"

      - name: Ansible syntax check
        run: |
          ansible-playbook" \
          -i "inventories/${{ inputs.environment }}/inventory.yml" \
          --vault-password-file "${{ runner.temp }}/vault_pass" \
          --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
          --syntax-check \
          "playbooks/${{ inputs.ansible-playbook }}.yml"

      - name: Ansible check
        run: |
          set -o pipefail

          ansible-playbook" \
          -i "inventories/${{ inputs.environment }}/inventory.yml" \
          --vault-password-file "${{ runner.temp }}/vault_pass" \
          --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
          --check \
          --diff \
          "playbooks/${{ inputs.ansible-playbook }}.yml" \
          | tee "${{ runner.temp }}/ansible-check.txt"

      - name: Comment Ansible check to PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          path: "${{ runner.temp }}/ansible-check.txt"

      - name: Upload Ansible check as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ inputs.concurrency-group }}-check"
          path: "${{ runner.temp }}/ansible-check.txt"
          if-no-files-found: error
          retention-days: 14
