---
name: Reusable Ansible Check

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string

      concurrency-group:
        required: true
        type: string

      runner:
        required: true
        type: string

      ansible-playbook:
        required: true
        type: string

      ansible-inventory-group:
        required: true
        type: string

      environment:
        required: true
        type: string

    secrets:
      ansible_ssh_private_key:
        required: true

      ansible_vault_password:
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ inputs.concurrency-group }}
  cancel-in-progress: false

jobs:
  yamllint:
    name: YAML Linting
    runs-on: ${{ fromJSON(inputs.runner) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Run yamllint
        run: yamllint --format github .

  gitleaks:
    name: Secrets Scan
    runs-on: ${{ fromJSON(inputs.runner) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          # Temporary, automatically generated GitHub Token for GH API access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Security Scan
    runs-on: ${{ fromJSON(inputs.runner) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'

  reusable-ansible-check:
    name: Ansible Check
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(inputs.runner) }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    env:
      ANSIBLE_NOCOLOR: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # Pinned version to ensure reproducibility but allow newest patches.
          python-version: "3.13"

      - name: Configure SSH
        run: |
          mkdir -p "${{ runner.temp }}/.ssh"
          chmod 700 "${{ runner.temp }}/.ssh"

          printf '%s' "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > "${{ runner.temp }}/.ssh/id_ed25519_ansible"

          chmod 600 "${{ runner.temp }}/.ssh/id_ed25519_ansible"

      - name: Create Python virtual environment
        run: |
          python -m venv "${{ runner.temp }}/venv"

      - name: Install Ansible and requirements
        run: |
          "${{ runner.temp }}/venv/bin/python" -m pip install --upgrade pip
          "${{ runner.temp }}/venv/bin/python" -m pip install -r requirements.txt
          "${{ runner.temp }}/venv/bin/ansible-galaxy" collection install -r requirements.yml

      - name: Add venv to PATH
        run: echo "${{ runner.temp }}/venv/bin" >> "$GITHUB_PATH"

      - name: Create vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "${{ runner.temp }}/vault_pass"
          chmod 600 "${{ runner.temp }}/vault_pass"

      - name: Wait for machines
        run: |
          "${{ runner.temp }}/venv/bin/ansible" ${{ inputs.ansible-inventory-group }} \
            -i "inventories/${{ inputs.environment }}/inventory.yml" \
            --vault-password-file "${{ runner.temp }}/vault_pass" \
            --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=300"

      - name: Syntax check
        run: |
          "${{ runner.temp }}/venv/bin/ansible-playbook" \
          -i "inventories/${{ inputs.environment }}/inventory.yml" \
          --vault-password-file "${{ runner.temp }}/vault_pass" \
          --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
          --syntax-check \
          "playbooks/${{ inputs.ansible-playbook }}.yml"

      - name: Ansible check
        run: |
          set -o pipefail

          "${{ runner.temp }}/venv/bin/ansible-playbook" \
          -i "inventories/${{ inputs.environment }}/inventory.yml" \
          --vault-password-file "${{ runner.temp }}/vault_pass" \
          --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
          --check \
          --diff \
          "playbooks/${{ inputs.ansible-playbook }}.yml" \
          | tee "${{ runner.temp }}/ansible-check.txt"

      - name: Comment Ansible check
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          path: "${{ runner.temp }}/ansible-check.txt"

      - name: Upload Ansible check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ inputs.concurrency-group }}-check"
          path: "${{ runner.temp }}/ansible-check.txt"
          if-no-files-found: error
          retention-days: 14
