---
name: Reusable Ansible Apply

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string

      concurrency-group:
        required: true
        type: string

      runner:
        required: true
        type: string

      ansible-playbook:
        required: true
        type: string

      ansible-inventory-group:
        required: true
        type: string

      environment:
        required: true
        type: string

    secrets:
      ansible_ssh_private_key:
        required: true

      ansible_vault_password:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency-group }}
  cancel-in-progress: false

jobs:
  reusable-ansible-apply:
    name: Ansible Apply
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJSON(inputs.runner) }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          # Pinned major and minor version to ensure reproducibility but allow newest patches.
          python-version: "3.13"

      - name: Configure SSH
        run: |
          mkdir -p "${{ runner.temp }}/.ssh"
          chmod 700 "${{ runner.temp }}/.ssh"

          printf '%s' "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > "${{ runner.temp }}/.ssh/id_ed25519_ansible"

          chmod 600 "${{ runner.temp }}/.ssh/id_ed25519_ansible"

      - name: Create Python virtual environment
        run: |
          python -m venv "${{ runner.temp }}/venv"

      - name: Install Ansible and requirements
        run: |
          "${{ runner.temp }}/venv/bin/python" -m pip install --upgrade pip
          "${{ runner.temp }}/venv/bin/python" -m pip install -r requirements.txt
          "${{ runner.temp }}/venv/bin/ansible-galaxy" collection install -r requirements.yml

      - name: Create vault password file
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "${{ runner.temp }}/vault_pass"
          chmod 600 "${{ runner.temp }}/vault_pass"

      - name: Wait for machines
        run: |
          "${{ runner.temp }}/venv/bin/ansible" ${{ inputs.ansible-inventory-group }} \
            -i "inventories/${{ inputs.environment }}/inventory.yml" \
            --vault-password-file "${{ runner.temp }}/vault_pass" \
            --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
            -m ansible.builtin.wait_for_connection \
            -a "timeout=300"

      - name: Execute Ansible playbook
        run: |
          "${{ runner.temp }}/venv/bin/ansible-playbook" \
          -i "inventories/${{ inputs.environment }}/inventory.yml" \
          --vault-password-file "${{ runner.temp }}/vault_pass" \
          --private-key "${{ runner.temp }}/.ssh/id_ed25519_ansible" \
          "playbooks/${{ inputs.ansible-playbook }}.yml"
