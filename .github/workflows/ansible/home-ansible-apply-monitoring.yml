name: Home - Ansible Apply - monitoring

on:
  push:
    branches:
        - main
    paths:
      - "ansible/inventories/home/**"
      - "ansible/playbooks/monitoring.yml"
      - "ansible/roles/**"
      - "ansible/requirements.yml"
      - "ansible/ansible.cfg"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-apply-monitoring:
    uses: ./.github/workflows/reusable-ansible-apply.yml
    with:
      working-directory: ansible
      concurrency-group: home-ansible-monitoring
      runner: '["self-hosted", "linux", "terraform", "dev"]'
      ansible-playbook: monitoring
      ansible-group: monitoring

    secrets:
      ansible_ssh_private_key: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
      ansible_vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
