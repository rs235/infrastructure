name: Reusable Terraform Apply

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      
      # ansible-playbook:
      #   required: true
      #   type: string

      # ansible-group:
      #   required: true
      #   type: string

      concurrency-group:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency-group }}
  cancel-in-progress: false

jobs:
  template-terraform-apply:
    runs-on:
      - self-hosted
      - infra
      - home
    
    env:
      TF_INPUT: "0"
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_INSECURE: ${{ secrets.PROXMOX_VE_INSECURE }}

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          # Pinned exact version to ensure reproducibility. 
          terraform_version: "1.15.0"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

