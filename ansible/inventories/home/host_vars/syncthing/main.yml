---
linux_users:
  - name: rs
    comment: "Admin Account"
    group: rs
    uid: 1001
    gid: 1001
    create_home: true
    home: /home/rs
    system: false
    shell: /bin/bash
    groups:
      - sudo
    ssh_key: "{{ ssh_key_rs }}"
    sudo_nopasswd: true

  - name: syncthing
    comment: "Syncthing service account"
    group: syncthing
    uid: 1500
    gid: 1500
    create_home: true
    home: /var/lib/syncthing
    system: true
    shell: /usr/sbin/nologin

cifs_mounts:
  - server: "truenas.{{ domain_name }}"
    share: rs
    mount_point: /mnt/rs
    username: syncthing
    password: "{{ smb_syncthing_password }}"

cifs_mount_points:
  - /mnt/rs

syncthing_user: syncthing
syncthing_group: syncthing