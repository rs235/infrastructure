---
cifs_mounts:
  - server: "truenas.{{ domain_name }}"
    share: common
    mount_point: /mnt/common
    username: common
    password: "{{ smb_common_password }}"

  - server: truenas.home.arpa
    share: media
    mount_point: /mnt/media
    username: media
    password: "{{ smb_media_password }}"

  - server: truenas.home.arpa
    share: downloads
    mount_point: /mnt/downloads
    username: downloads
    password: "{{ smb_downloads_password }}"
