---
- name: Ensure dependencies are installed
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 604800

- name: Install prometheus-pve-exporter
  ansible.builtin.pip:
    name: prometheus-pve-exporter={{ pve_exporter_version }}
    state: present
    virtualenv: /opt/prometheus-pve-exporter/venv
    virtualenv_command: python3 -m venv