---
- name: Install qbittorrent-nox (state=present is optional)
  ansible.builtin.apt:
    name: qbittorrent-nox
    update_cache: true
    cache_valid_time: 3600
    state: present

- name: Install qBittorrent systemd service
  ansible.builtin.template:
    src: qbittorrent.service.j2
    dest: /etc/systemd/system/qbittorrent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Systemd daemon reload
    - Systemd enable qbittorrent
    - Systemd restart qbittorrent

- name: Create qBittorrent config directory
  ansible.builtin.file:
    path: "{{ qbittorrent_config_dir }}"
    state: directory
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_group }}"
    mode: "0750"

- name: Copy qBittorrent configuration files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ qbittorrent_config_dir }}/{{ item }}"
    owner: "{{ qbittorrent_user }}"
    group: "{{ qbittorrent_group }}"
    mode: "0640"
    # backup: true
  loop:
    - qBittorrent.conf
    - categories.json
  notify: Systemd restart qbittorrent
